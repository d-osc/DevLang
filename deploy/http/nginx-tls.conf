# Start with: nginx -p /absolute/path/to/deploy/http/ -c nginx-tls.conf
# Create logs/, temp/ and certs/ first. Install a valid hostname certificate.
worker_processes 1;
pid logs/nginx.pid;
error_log logs/error.log warn;
events { worker_connections 512; }
http {
    access_log logs/access.log;
    client_body_temp_path temp/client;
    proxy_temp_path temp/proxy;
    client_max_body_size 64k;
    client_header_timeout 5s;
    client_body_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 10s;
    large_client_header_buffers 4 8k;
    limit_conn_zone $server_name zone=dev_active:1m;
    server {
        listen 127.0.0.1:8443 ssl;
        ssl_certificate certs/fullchain.pem;
        ssl_certificate_key certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:dev_tls:1m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;
        server_name localhost;
        limit_conn dev_active 16;
        limit_conn_status 503;
        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Connection close;
            proxy_set_header Host $host;
            proxy_request_buffering on;
            proxy_buffering on;
            proxy_connect_timeout 2s;
            proxy_send_timeout 5s;
            proxy_read_timeout 10s;
            proxy_next_upstream off;
        }
    }
}
