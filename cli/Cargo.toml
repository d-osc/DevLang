[package]
name = "dev-cli"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
dev-syntax = { path = "../syntax" }
dev-lang = { path = "../compiler" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
url = "2"
dunce = "1"
pathdiff = "0.2"
semver = "1"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
tar = "0.4"
flate2 = "1"

[[bin]]
name = "d"
path = "src/main.rs"
