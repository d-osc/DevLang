name: DevLang checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Linux native build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang autoconf automake libtool
      - name: Build executables
        run: cargo build --workspace --release --locked
      - name: Rust tests
        run: cargo test --workspace --locked
      - name: DON-style object literals
        run: python scripts/smoke_don_objects.py --bin-dir target/release
      - name: Hosted native DON object parity
        run: python scripts/smoke_native_objects.py --bin-dir target/release
      - name: Prototype collection and filesystem task regressions
        run: python scripts/smoke_runtime_resources.py --bin-dir target/release
      - name: String interpolation parity
        run: python scripts/smoke_interpolation.py --bin-dir target/release
      - name: Canonical type annotation parity
        run: python scripts/smoke_type_annotations.py --bin-dir target/release
      - name: Numeric cast parity and safety
        run: python scripts/smoke_numeric_casts.py --bin-dir target/release
      - name: Safety and aggregate FFI parity
        run: python scripts/smoke_safety.py --bin-dir target/release
      - name: Build native standard library
        run: python stdlib/build.py
      - name: Resolve executable paths
        shell: python
        run: |
          import os
          from pathlib import Path
          executable = Path('target/release') / ('d.exe' if os.name == 'nt' else 'd')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write('DEVLANG_TEST_D=' + str(executable.resolve()) + '\n')
      - name: Incremental language-server workspace navigation
        run: python scripts/smoke_lsp_index.py --bin "${{ env.DEVLANG_TEST_D }}"
      - name: Package examples and dependency regressions
        run: python scripts/verify_package_examples.py --d "${{ env.DEVLANG_TEST_D }}"
      - name: Package Store validation and template
        run: python scripts/smoke_package_store.py --d "${{ env.DEVLANG_TEST_D }}"
      - name: Store install, upgrade and isolated graph integration
        run: python scripts/smoke_store_integration.py --d "${{ env.DEVLANG_TEST_D }}"
      - name: Package resolver, scripts, policies and offline cache
        run: python scripts/smoke_package_features.py --d "${{ env.DEVLANG_TEST_D }}"
      - name: Contextual peers, frozen install and global launchers
        run: python scripts/smoke_package_contexts.py --d "${{ env.DEVLANG_TEST_D }}"
      - name: Package Store UI regressions
        run: node scripts/smoke_package_store_ui.cjs
      - name: Workspace and version resolution
        run: python scripts/smoke_workspaces.py --bin-dir target/release
      - name: Formatter and language server integration
        run: python scripts/smoke_tooling.py --bin-dir target/release
