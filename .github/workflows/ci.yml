name: DevLang checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Linux native build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang autoconf automake libtool nginx
      - name: Validate HTTP reverse proxy profile
        if: runner.os == 'Linux'
        run: |
          mkdir -p deploy/http/logs deploy/http/temp/client deploy/http/temp/proxy
          nginx -t -p "$GITHUB_WORKSPACE/deploy/http/" -c nginx.conf
      - name: Build executables
        run: cargo build --workspace --release --locked
      - uses: actions/setup-go@v6
        if: runner.os == 'Linux'
        with:
          go-version: stable
          cache: false
      - name: Export C ABI to C, C++, Rust and Go
        if: runner.os == 'Linux'
        run: python scripts/smoke_export_interop.py --d target/release/d
      - name: Export C ABI to C, C++ and Rust on Windows
        if: runner.os == 'Windows'
        run: python scripts/smoke_export_interop.py --d target/release/d.exe --languages c,cpp,rust
      - name: Live HTTP ingress protections
        if: runner.os == 'Linux'
        run: python scripts/smoke_http_ingress.py --bin-dir target/release
      - name: Live HTTPS ingress and certificate verification
        if: runner.os == 'Linux'
        run: python scripts/smoke_http_ingress.py --bin-dir target/release --tls
      - name: Windows kernel worker containment
        if: runner.os == 'Windows'
        run: python scripts/smoke_windows_job.py
      - name: HTTP worker supervision and recovery
        run: python scripts/smoke_http_supervisor.py --bin-dir target/release
      - name: Rust tests
        run: cargo test --workspace --locked
      - name: Source resource limits and allocation cycles
        run: python scripts/smoke_production_limits.py --bin-dir target/release --report out/production-limits.json
      - name: HTTP handler recovery and bounded-load RSS regression
        run: python scripts/soak_http_server.py --bin-dir target/release --requests 1000 --report out/http-soak.json
      - name: Web API example HTTP regression
        run: python scripts/smoke_web_api.py
      - name: Node-style filesystem and HTTP listener regression
        run: python scripts/smoke_node_io.py --bin-dir target/release
      - name: DON-style object literals
        run: python scripts/smoke_don_objects.py --bin-dir target/release
      - name: Hosted native DON object parity
        run: python scripts/smoke_native_objects.py --bin-dir target/release
      - name: Prototype collection and filesystem task regressions
        run: python scripts/smoke_runtime_resources.py --bin-dir target/release
      - name: Interactive source debugger regressions
        run: python scripts/smoke_runtime_debugger.py --bin-dir target/release
      - name: String interpolation parity
        run: python scripts/smoke_interpolation.py --bin-dir target/release
      - name: Canonical type annotation parity
        run: python scripts/smoke_type_annotations.py --bin-dir target/release
      - name: Numeric cast parity and safety
        run: python scripts/smoke_numeric_casts.py --bin-dir target/release
      - name: Safety and aggregate FFI parity
        run: python scripts/smoke_safety.py --bin-dir target/release
      - name: Build native standard library
        run: python stdlib/build.py
      - name: Resolve executable paths
        shell: python
        run: |
          import os
          from pathlib import Path
          executable = Path('target/release') / ('d.exe' if os.name == 'nt' else 'd')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write('DEVLANG_TEST_D=' + str(executable.resolve()) + '\n')
      - name: Incremental language-server workspace navigation
        run: python scripts/smoke_lsp_index.py --bin "${{ env.DEVLANG_TEST_D }}"
      - name: Package examples and dependency regressions
        run: python scripts/verify_package_examples.py --d "${{ env.DEVLANG_TEST_D }}"
      - name: Package Store validation and template
        run: python scripts/smoke_package_store.py --d "${{ env.DEVLANG_TEST_D }}"
      - name: Store install, upgrade and isolated graph integration
        run: python scripts/smoke_store_integration.py --d "${{ env.DEVLANG_TEST_D }}"
      - name: Package resolver, scripts, policies and offline cache
        run: python scripts/smoke_package_features.py --d "${{ env.DEVLANG_TEST_D }}"
      - name: Package script shortcuts and arguments
        run: python scripts/smoke_script_shortcuts.py --bin "${{ env.DEVLANG_TEST_D }}"
      - name: Contextual peers, frozen install and global launchers
        run: python scripts/smoke_package_contexts.py --d "${{ env.DEVLANG_TEST_D }}"
      - name: Package Store UI regressions
        run: node scripts/smoke_package_store_ui.cjs
      - name: Workspace and version resolution
        run: python scripts/smoke_workspaces.py --bin-dir target/release
      - name: Formatter and language server integration
        run: python scripts/smoke_tooling.py --bin-dir target/release
