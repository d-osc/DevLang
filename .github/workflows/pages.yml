name: Deploy DevLang documentation

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/**'
      - 'examples/**'
      - 'skills/devlang/**'
      - 'cli/README.md'
      - 'scripts/build_module_docs.py'
      - 'syntax/src/*intrinsics.rs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install website dependencies
        run: python -m pip install --target website/.build-deps -r website/requirements.txt
      - name: Build documentation with validated example snapshots
        run: python website/build.py --skip-validation
      - name: Check per-module signatures and API contracts
        run: python scripts/build_module_docs.py --check
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v5
